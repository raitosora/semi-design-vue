name: Project checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - name: Check repository boundaries
        run: |
          test -z "$(git ls-files -- docs experiments NOTICE.md 'CONTRIB*')"
      - run: pnpm install --frozen-lockfile
      - name: Validate new commit messages and PR title
        run: pnpm check:commit-messages
      - name: Require component documentation and regression changes
        run: pnpm check:component-changes
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - name: Verify source, packages and isolated tarball consumers
        run: pnpm verify
      - run: pnpm audit --audit-level moderate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-evidence
          include-hidden-files: true
          path: |
            artifacts/coverage
            artifacts/surfaces.json
            playwright-report
            test-results
            website/.artifacts/playwright-report
            website/.artifacts/test-results
            .vitest/attachments
          retention-days: 14
